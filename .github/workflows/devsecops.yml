name: DevSecOps Shift-Left Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Escaneo de Secretos (Gitleaks)
  gitleaks-secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Análisis Estático de Seguridad (SAST - Semgrep)
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep Security Rules
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/javascript

  # 3. Análisis de Composición de Software (SCA - Trivy)
  sca-dependencies:
    name: SCA Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Escanear Vulnerabilidades en Dependencias
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # 4. Seguridad de Infraestructura como Código (IaC - Checkov)
  iac-checkov:
    name: IaC Security (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Ejecutar Checkov sobre Docker Compose y Dockerfiles
        uses: bridgecrewio/checkov-action@master
        with:
          framework: dockerfile,compose
          soft_fail: true

  # 5. Escaneo de Imágenes de Contenedor (Docker + Trivy)
  container-security:
    name: Container Security & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Construir Imagen Backend
        run: docker build -t activos-backend:test ./backend

      - name: Escaneo Trivy de Imagen Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'activos-backend:test'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # 6. Análisis Dinámico de Seguridad (DAST - OWASP ZAP)
  dast-zap-scan:
    name: DAST Baseline Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [container-security]
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Iniciar Servicios con Docker Compose
        run: |
          docker compose up -d postgres-db api-core
          sleep 10

      - name: OWASP ZAP Baseline Scan contra API
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000/api/health'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          fail_action: false
