services:
  # ============================================================
  # 1. Base de Datos: PostgreSQL 16 (Red Aislada)
  # ============================================================
  postgres-db:
    image: postgres:16-alpine
    container_name: inventario-postgres
    restart: unless-stopped
    environment:
      # SIN FALLBACKS. Si falta el .env, el contenedor no arranca.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - inventario-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # ============================================================
  # 2. API Core (Backend Express + Node.js)
  # ============================================================
  api-core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventario-api
    restart: unless-stopped
    # ELIMINADO: ports: - "5000:5000" (Acceso solo vía red interna)
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
      - ./backend/templates:/app/templates
    networks:
      - inventario-net
    depends_on:
      postgres-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # ============================================================
  # 3. Worker Autónomo
  # ============================================================
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: inventario-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads-data:/app/uploads
    networks:
      - inventario-net
    depends_on:
      postgres-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'

  # ============================================================
  # 4. Frontend (React + Vite servido con Nginx)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventario-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - inventario-net
    depends_on:
      - api-core

  # ============================================================
  # 5. API Gateway / Proxy Inverso (Terminación TLS)
  # ============================================================
  reverse-proxy:
    image: nginx:alpine
    container_name: inventario-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - inventario-net
    depends_on:
      - frontend

networks:
  inventario-net:
    driver: bridge

volumes:
  pgdata:
  uploads-data:

