server {
    listen 80;
    server_name vaultti vaultti.local 192.168.60.87 localhost 127.0.0.1;
    server_tokens off;
    # Forzar redirección de HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vaultti vaultti.local 192.168.60.87 localhost 127.0.0.1;
    server_tokens off;

    # Certificados
    ssl_certificate /etc/nginx/ssl/inventario.crt;
    ssl_certificate_key /etc/nginx/ssl/inventario.key;

    # Fortalecimiento criptográfico (OWASP)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cabeceras de seguridad HTTP en el borde TLS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


